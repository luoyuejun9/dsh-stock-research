name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run pack:check
      - name: Verify packed files contain no secrets
        run: |
          npm pack --json > pack.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("pack.json"))[0].filename; const {execFileSync}=require("child_process"); const out=execFileSync("tar",["-tf",p],{encoding:"utf8"}); if(/(^|\/)(\.env|node_modules)(\/|$)/m.test(out)) process.exit(1)'
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
