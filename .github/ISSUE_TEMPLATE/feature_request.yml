name: Feature request
description: Propose a bounded product or data-source improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research problem
      description: "Describe the decision-support problem, not a request for trading advice."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source, entitlement, and provenance impact
      description: "For a data source, link its terms/docs and state required credentials, market scope, data freshness, and redistribution constraints."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
